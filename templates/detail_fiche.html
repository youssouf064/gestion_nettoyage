<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détail Fiche de Paie #{{ fiche.id }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>Fiche de Paie : {{ fiche.nom_fichier }}</h2>
    <p class="text-muted">Importé le : {{ fiche.date_import.strftime('%d/%m/%Y à %H:%M') }}</p>

    <table class="table table-striped table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Champ (Auto-détecté)</th>
                <th>Valeur</th>
            </tr>
        </thead>
        <tbody>
            {% for item in fiche.valeurs %}
            <tr>
                <td><strong>{{ item.champ.nom }}</strong></td>
                <td>{{ item.valeur }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2" class="text-center text-muted">Aucune donnée à afficher pour cette fiche.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/fiches" class="btn btn-secondary">Retour à la liste</a>
</body>
</html>
